<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.05">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Glow effect -->
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="url(#glowGrad)"/>

  <!-- Icon container -->
  <g transform="translate(450, 160)">
    <!-- Large search icon -->
    <circle cx="150" cy="130" r="80" fill="none" stroke="url(#accentGrad)" stroke-width="12"/>
    <line x1="210" y1="190" x2="280" y2="260" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Image elements in lens -->
    <rect x="90" y="90" width="120" height="80" rx="8" fill="none" stroke="white" stroke-width="4" opacity="0.8"/>
    <circle cx="120" cy="115" r="12" fill="white" opacity="0.6"/>
    <path d="M95 155 L130 125 L155 145 L195 110 L205 165" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>

  <!-- Title -->
  <text x="600" y="450" text-anchor="middle" font-family="Inter, sans-serif" font-size="56" font-weight="700" fill="white">
    Qwen3-VL Search
  </text>

  <!-- Subtitle -->
  <text x="600" y="510" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" fill="#a1a1aa">
    Multimodal Image Search powered by AI
  </text>

  <!-- Bottom accent line -->
  <rect x="450" y="560" width="300" height="4" rx="2" fill="url(#accentGrad)"/>
</svg>
